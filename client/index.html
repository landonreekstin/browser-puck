<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser-puck</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111418; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #tuning {
        position: fixed; top: 8px; right: 8px; bottom: 8px; width: 280px; overflow-y: auto;
        padding: 10px; background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
        border-radius: 6px; color: #e6edf3; font: 12px ui-monospace, monospace;
      }
      #tuning[hidden] { display: none; }
      #tuning label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 6px; }
      #tuning input { grid-column: 1 / -1; width: 100%; }
      #tuning .value { color: #ffd866; }
      #tuning .buttons { display: flex; gap: 6px; margin-top: 8px; }
      #tuning button {
        flex: 1; background: #21262d; color: inherit; border: 1px solid #30363d;
        border-radius: 4px; padding: 4px; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
