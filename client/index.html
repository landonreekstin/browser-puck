<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser-puck</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111418; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #tuning {
        position: fixed; top: 8px; right: 8px; bottom: 8px; width: 280px; overflow-y: auto;
        padding: 10px; background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
        border-radius: 6px; color: #e6edf3; font: 12px ui-monospace, monospace;
      }
      #tuning[hidden] { display: none; }
      #tuning label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 6px; }
      #tuning input { grid-column: 1 / -1; width: 100%; }
      #tuning .value { color: #ffd866; }
      #tuning .buttons { display: flex; gap: 6px; margin-top: 8px; }
      #tuning button {
        flex: 1; background: #21262d; color: inherit; border: 1px solid #30363d;
        border-radius: 4px; padding: 4px; font: inherit; cursor: pointer;
      }
      #lobby {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
        padding: 20px; box-sizing: border-box; background: rgba(13, 17, 23, 0.95);
        border: 1px solid #30363d; border-radius: 8px; color: #e6edf3;
        font: 14px ui-monospace, monospace;
      }
      #lobby[hidden], #end-match[hidden] { display: none; }
      #lobby h1 { margin: 0 0 12px; font-size: 20px; }
      #lobby h2 { margin: 0 0 8px; font-size: 15px; }
      #lobby .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
      #lobby input { background: #0d1117; color: inherit; border: 1px solid #30363d; border-radius: 4px; padding: 6px 8px; font: inherit; }
      #lobby input.link { flex: 1; min-width: 0; }
      #lobby #code { width: 6ch; text-transform: uppercase; }
      #lobby button, #end-match {
        background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px;
        padding: 6px 12px; font: 14px ui-monospace, monospace; cursor: pointer;
      }
      #lobby button:disabled { opacity: 0.5; cursor: default; }
      #lobby .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 520px) { #lobby .teams { grid-template-columns: 1fr; } }
      #lobby .team { border: 1px solid; border-radius: 6px; padding: 10px; }
      #lobby .slot { display: grid; grid-template-columns: 9ch 1fr auto; gap: 6px; align-items: center; padding: 3px 0; }
      #lobby .slot.mine .who { color: #ffd866; }
      #lobby .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #lobby .dim, #lobby .dim a { color: #8b949e; }
      #lobby .error { color: #ff7b72; min-height: 1.2em; }
      #end-match { position: fixed; top: 10px; right: 10px; }
      #lobby.docked {
        top: auto; left: auto; right: 10px; bottom: 36px; transform: none;
        width: min(440px, calc(100vw - 32px)); padding: 12px; font-size: 12px; opacity: 0.92;
      }
      #lobby.docked h1 { font-size: 15px; margin-bottom: 6px; }
      #lobby.docked .row:first-of-type { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
